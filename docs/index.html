<style>
/* 版面：單欄答案卷。頁首進度軌 → 模式選擇 → 題卡（左側導航色標尺）→ 成績與弱點分析 */
:root{
  --ink:#16181d; --ink-2:#4a5468; --ink-3:#737f94;
  --paper:#fbfbfc; --card:#ffffff; --line:#dfe3ea; --line-2:#eceff4;
  --navy:#1f3864; --navy-soft:#eef1f7;
  --gold:#c47f17; --gold-soft:#fdf4e8;
  --good:#1a7f52; --good-soft:#e9f5ef;
  --bad:#b3261e; --bad-soft:#fdeceb;
  --shadow:0 1px 2px rgba(31,56,100,.06), 0 6px 20px -12px rgba(31,56,100,.22);
  --on-navy:#ffffff;
  --f-head:"Noto Serif TC", "Songti TC", serif;
  --f-body:"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-num:ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ink:#e8ecf3; --ink-2:#aab4c6; --ink-3:#7e8a9e;
  --paper:#12151b; --card:#191d25; --line:#2b313c; --line-2:#222833;
  --navy:#9db4dc; --navy-soft:#1c2433;
  --gold:#e0a84e; --gold-soft:#2a2316;
  --good:#5ec294; --good-soft:#15271f;
  --bad:#f08a82; --bad-soft:#2b1917;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.7);
  --on-navy:#12151b;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ink:#e8ecf3; --ink-2:#aab4c6; --ink-3:#7e8a9e;
  --paper:#12151b; --card:#191d25; --line:#2b313c; --line-2:#222833;
  --navy:#9db4dc; --navy-soft:#1c2433;
  --gold:#e0a84e; --gold-soft:#2a2316;
  --good:#5ec294; --good-soft:#15271f;
  --bad:#f08a82; --bad-soft:#2b1917;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.7);
  --on-navy:#12151b;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);
  font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:20;background:var(--paper)}

/* ── 頁首 ── */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--paper);
  border-bottom:1px solid var(--line);margin-bottom:26px}
.hrow{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:11px}
.brand{font-family:var(--f-head);font-weight:700;font-size:16px;color:var(--navy);
  letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;
  color:var(--ink-3);letter-spacing:.04em}
.hspace{flex:1;min-width:0}
.hstat{font-family:var(--f-num);font-size:12px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.rail{height:3px;background:var(--line-2)}
.rail > i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s ease}

/* ── 共用 ── */
h1{font-family:var(--f-head);font-size:27px;line-height:1.35;margin:4px 0 8px;
  text-wrap:balance;letter-spacing:.01em}
h2{font-family:var(--f-head);font-size:19px;margin:0 0 12px;text-wrap:balance}
p{margin:0 0 12px}
.lede{color:var(--ink-2);margin-bottom:22px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  font-weight:500;margin-bottom:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 18px;border-radius:7px;border:1px solid var(--navy);background:var(--navy);
  color:var(--on-navy);font-weight:500;font-size:14px;transition:opacity .15s}
.btn:hover{opacity:.86}
.btn.ghost{background:transparent;color:var(--navy);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--navy);opacity:1}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ── 模式卡 ── */
.modes{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:26px}
.mode{display:flex;flex-direction:column;gap:5px;text-align:left;padding:16px 17px;
  background:var(--card);border:1px solid var(--line);border-left:3px solid var(--navy);
  border-radius:3px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-width:0}
.mode:hover{transform:translateY(-1px);border-left-color:var(--gold)}
.mode:disabled{opacity:.45}
.mode b{font-family:var(--f-head);font-size:16px;color:var(--ink)}
.mode span{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.mode em{font-style:normal;font-family:var(--f-num);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}

/* ── 題卡 ── */
.q{background:var(--card);border:1px solid var(--line);border-radius:3px;
  box-shadow:var(--shadow);padding:20px 20px 18px;margin-bottom:16px;
  border-left:3px solid var(--line);min-width:0}
.q.is-mc{border-left-color:var(--navy)}
.q.is-calc{border-left-color:var(--gold)}
.qhead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:11px}
.qno{font-family:var(--f-num);font-size:12px;font-weight:700;color:var(--navy);
  background:var(--navy-soft);padding:2px 8px;border-radius:3px;font-variant-numeric:tabular-nums}
.tag{font-size:11px;color:var(--ink-3);border:1px solid var(--line);
  padding:1px 7px;border-radius:99px;white-space:nowrap}
.tag.lec{color:var(--gold);border-color:var(--gold)}
.stem{margin-bottom:13px;line-height:1.8}
.stem b{color:var(--navy)}

/* 表格 */
.tw{overflow-x:auto;margin:0 0 14px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:13px;min-width:100%;
  font-variant-numeric:tabular-nums;font-family:var(--f-num)}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:center;white-space:nowrap}
th{background:var(--navy-soft);color:var(--navy);font-weight:700}
td:first-child,th:first-child{text-align:left;font-family:var(--f-body);font-weight:500}

/* 選項 */
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border:1px solid var(--line);
  border-radius:5px;background:transparent;text-align:left;line-height:1.65;font-size:14.5px;
  color:var(--ink);transition:border-color .12s,background .12s;width:100%;min-width:0}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt .k{font-family:var(--f-num);font-weight:700;color:var(--ink-3);flex:none}
.opt .v{min-width:0;flex:1}
.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--navy-soft)}
.opt[aria-pressed="true"] .k{color:var(--navy)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .k{color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default}

/* 計算題小題 */
.part{border-top:1px solid var(--line-2);padding-top:13px;margin-top:13px}
.part:first-of-type{border-top:0;margin-top:0}
.plab{font-family:var(--f-num);font-weight:700;color:var(--navy);margin-right:6px}
.pq{margin-bottom:9px;line-height:1.75}
.inrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
input[type=text]{font:inherit;font-family:var(--f-num);font-variant-numeric:tabular-nums;
  padding:8px 11px;border:1px solid var(--line);border-radius:5px;background:var(--card);
  color:var(--ink);width:150px;max-width:100%}
input[type=text]:focus{border-color:var(--navy)}
textarea{font:inherit;width:100%;min-height:76px;padding:9px 11px;border:1px solid var(--line);
  border-radius:5px;background:var(--card);color:var(--ink);resize:vertical;line-height:1.7}
textarea:focus{border-color:var(--navy)}
.unit{font-size:13px;color:var(--ink-3)}
.tolnote{font-size:11.5px;color:var(--ink-3);font-family:var(--f-num)}

/* 詳解 */
.sol{margin-top:11px;padding:12px 14px;border-radius:5px;font-size:13.5px;line-height:1.8;
  background:var(--navy-soft);border-left:3px solid var(--navy)}
.sol.good{background:var(--good-soft);border-left-color:var(--good)}
.sol.bad{background:var(--bad-soft);border-left-color:var(--bad)}
.sol .lab{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:5px;font-weight:500}
.sol b{color:var(--navy)}
.sol.good b{color:var(--good)}
.sol.bad b{color:var(--bad)}
.note{margin-top:11px;padding:11px 14px;border-radius:5px;background:var(--gold-soft);
  border-left:3px solid var(--gold);font-size:13px;line-height:1.75}
.note .lab{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold);margin-bottom:4px;font-weight:700}
.rub{margin:9px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.rub li{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.65}
.rub input{margin:4px 0 0;flex:none;accent-color:var(--good);width:15px;height:15px}
.verdict{font-family:var(--f-num);font-size:12px;font-weight:700;padding:1px 8px;
  border-radius:3px;margin-left:auto;white-space:nowrap}
.verdict.ok{color:var(--good);background:var(--good-soft)}
.verdict.no{color:var(--bad);background:var(--bad-soft)}
.verdict.half{color:var(--gold);background:var(--gold-soft)}

/* ── 成績 ── */
.score{background:var(--card);border:1px solid var(--line);border-radius:3px;
  box-shadow:var(--shadow);padding:22px;margin-bottom:18px;border-top:3px solid var(--navy)}
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.big .n{font-family:var(--f-num);font-size:46px;font-weight:700;line-height:1;
  color:var(--navy);font-variant-numeric:tabular-nums}
.big .d{font-size:13px;color:var(--ink-2)}
.split{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin:16px 0 4px}
.sp{padding:11px 13px;border:1px solid var(--line);border-radius:4px;min-width:0}
.sp .t{font-size:11.5px;color:var(--ink-3);margin-bottom:3px}
.sp .v{font-family:var(--f-num);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.bars{margin-top:18px;display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,9.5em) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.bar .nm{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:7px;background:var(--line-2);border-radius:99px;overflow:hidden;min-width:0}
.bar .tr i{display:block;height:100%;border-radius:99px;background:var(--good)}
.bar .tr i.warn{background:var(--gold)}
.bar .tr i.poor{background:var(--bad)}
.bar .pc{font-family:var(--f-num);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.hist{font-size:12.5px;color:var(--ink-2);margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2)}
.hist .num{color:var(--ink)}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink-3);line-height:1.8}
@media (max-width:460px){
  .split{grid-template-columns:1fr}
  .big .n{font-size:38px}
  h1{font-size:23px}
  .bar{grid-template-columns:minmax(0,6.5em) 1fr auto}
}
</style></head>

<script>
const DATA = {"meta":{"course":"統計學（一）","chapter":"第 5 章　離散機率分配","n_mc":28,"n_calc":11,"n_parts":48,"n_num":30,"n_text":18,"lecture_ratio":0.8205,"topics":["二項分配","分配選擇與綜合判斷","卜瓦松分配","期望值與變異數","隨機變數與機率分配"]},"mc":[{"id":"M01","topic":"隨機變數與機率分配","src":"P.9 離散型與連續型隨機變數","lecture":true,"q":"下列哪一個隨機變數是「連續型」隨機變數？","table":null,"opts":["某超商一天賣出的咖啡杯數","一個班級中通過證照考試的人數","使用者從點擊到頁面載入完成所花的秒數","一週內伺服器當機的次數"],"ans":2,"exp":"連續型隨機變數可以取某一區間內的任何值（含小數），通常來自「測量」；離散型是用「數」的，結果是 0、1、2…。載入時間可以是 1.238 秒，屬於連續型；其餘三個都是在數個數。"},{"id":"M02","topic":"隨機變數與機率分配","src":"P.9 離散型與連續型隨機變數","lecture":true,"q":"某物流公司記錄每件包裹的重量（公斤）與每日送達的件數。關於這兩個變數，下列敘述何者正確？","table":null,"opts":["兩者都是離散型","重量是連續型，件數是離散型","重量是離散型，件數是連續型","兩者都是連續型"],"ans":1,"exp":"重量是量出來的，可以是 2.347 公斤，屬於連續型；件數是數出來的，只能是 0、1、2…，屬於離散型。判斷訣竅：問自己「這個數字是數來的還是量來的」。"},{"id":"M03","topic":"隨機變數與機率分配","src":"P.12 離散機率分配 f(x) 與兩個必要條件","lecture":true,"q":"離散機率分配 f(x) 必須同時滿足哪兩個條件？","table":null,"opts":["f(x) > 0 且 Σf(x) = 1","f(x) ≥ 0 且 Σf(x) = 1","f(x) ≥ 0 且 Σf(x) ≤ 1","0 \u003c f(x) \u003c 1 且 Σf(x) = 1"],"ans":1,"exp":"兩個條件是 f(x) ≥ 0（機率不能是負的，但\u003cb>可以等於 0\u003c/b>，表示該值不會出現）與 Σf(x) = 1（所有可能結果的機率加起來剛好是 1，不能多也不能少）。(A) 的「> 0」排除了機率為 0 的值，太嚴格。"},{"id":"M04","topic":"隨機變數與機率分配","src":"P.12 離散機率分配 f(x) 與兩個必要條件","lecture":true,"q":"某離散隨機變數 X 的四個可能值對應機率為 0.15、0.3、0.25、0.2。這是一個合法的機率分配嗎？","table":null,"opts":["是，每個值都介於 0 與 1 之間","不是，總和為 0.9，不等於 1","不是，機率值不可以重複","資料不足，還需要知道 X 的實際數值才能判斷"],"ans":1,"exp":"每個 f(x) 都 ≥ 0 ✓，但總和 = 0.9 ≠ 1 ✗，第二個條件不成立。檢查合法性時兩個條件都要驗，很多人只看第一個就下結論。注意 X 取什麼數值完全不影響這個判斷。"},{"id":"M05","topic":"隨機變數與機率分配","src":"P.14 離散型均勻機率分配","lecture":true,"q":"下列哪一個情境可以用「離散型均勻機率分配」描述？","table":null,"opts":["某手機行每日銷售量，賣 1 台的機率遠高於賣 5 台","擲一顆公正骰子出現的點數","8 筆可疑連線中真正是攻擊的筆數","每小時進入機房的人次"],"ans":1,"exp":"均勻分配要求\u003cb>每一個結果出現的機率完全相同\u003c/b>，f(x) = 1/n。公正骰子的六個點數各為 1/6 ✓。(A) 正是講義拿來當反例的 DiCarlo 情形 —— 各銷售量的機率差很多，不是均勻分配。"},{"id":"M06","topic":"隨機變數與機率分配","src":"P.16 練習 2 解答：機率分配與事件機率","lecture":true,"q":"某 App 單次開啟觀看影片數 X 的分配如下表。「至少觀看 2 部」與「觀看超過 2 部」的機率分別是多少？","table":{"head":["x（部）","0","1","2","3","4"],"rows":[["f(x)","0.08","0.22","0.34","0.24","0.12"]]},"opts":["都是 0.7","0.7 與 0.36","0.36 與 0.7","0.7 與 0.58"],"ans":1,"exp":"「至少 2 部」\u003cb>包含 2\u003c/b>：x = 2, 3, 4 → 0.34 + 0.24 + 0.12 = 0.7。\u003cbr>「超過 2 部」\u003cb>不含 2\u003c/b>：x = 3, 4 → 0.24 + 0.12 = 0.36。\u003cbr>一字之差，答案差了 0.34。看到不等號先確認有沒有等號。"},{"id":"M07","topic":"期望值與變異數","src":"P.5 先猜猜看：三個問題","lecture":true,"q":"擲一顆公正骰子，點數的期望值是 3.5，但骰子根本擲不出 3.5 點。下列敘述何者正確？","table":null,"opts":["期望值算錯了，骰子擲不出的值不可能是期望值","期望值是長期平均，不必是可能出現的值","期望值一定是出現機率最高的那一個值","離散隨機變數的期望值必須是整數"],"ans":1,"exp":"期望值是「做很多很多次之後的平均」，不是對下一次的預測，也不必落在可能值上。擲很多次，平均點數會趨近 3.5。期望值是分配的\u003cb>重心\u003c/b>，重心當然可以落在沒有實物的位置上。"},{"id":"M08","topic":"期望值與變異數","src":"P.20 DiCarlo 的期望值與變異數（表格法）","lecture":true,"q":"某手機行統計過去 300 個營業日的每日銷售量，得到下列分配。E(X) 是多少？","table":{"head":["x（台）","0","1","2","3","4","5"],"rows":[["天數","36","108","75","48","24","9"],["f(x)","0.12","0.36","0.25","0.16","0.08","0.03"]]},"opts":["1.81 台","2.31 台","2.50 台","4.83 台"],"ans":0,"exp":"E(X) = Σ x·f(x) = 0(0.12) + 1(0.36) + 2(0.25) + 3(0.16) + 4(0.08) + 5(0.03) = \u003cb>1.81\u003c/b> 台。\u003cbr>注意不是把 0～5 平均（那會得到 2.5，是選項 C 的陷阱），而是\u003cb>用機率加權\u003c/b>。期望值一定要乘上各自的機率。"},{"id":"M09","topic":"期望值與變異數","src":"P.19 變異數 Var(X) 與標準差 σ","lecture":false,"q":"計算離散隨機變數的變異數時，下列哪一個式子是正確的「捷徑公式」？","table":null,"opts":["Var(X) = E(X²) − [E(X)]²","Var(X) = [E(X)]² − E(X²)","Var(X) = E(X²) − E(X)","Var(X) = E[(X − μ)]²"],"ans":0,"exp":"捷徑公式是 Var(X) = E(X²) − μ²。推導：E[(X−μ)²] = E(X² − 2μX + μ²) = E(X²) − 2μE(X) + μ² = E(X²) − μ²。\u003cbr>(B) 順序顛倒會算出負數；(D) 少了平方的位置 —— 定義式是 E[(X−μ)\u003cb>²\u003c/b>]，平方在期望值\u003cb>裡面\u003c/b>。"},{"id":"M10","topic":"期望值與變異數","src":"P.21 期望值怎麼用在決策上","lecture":true,"q":"兩個投資方案的淨利分配不同，但 E(X) 都是 5 萬元，標準差分別為 σ_A ≈ 43.8 萬、σ_B ≈ 11 萬。下列敘述何者最適當？","table":null,"opts":["兩案完全等價，隨便選一個都可以","A 案比較好，因為標準差大代表報酬高","期望值相同時，σ 反映風險；保守者應選 B，能承受風險者才考慮 A","應該選 σ 較大的 A，因為變異數大代表資訊量多"],"ans":2,"exp":"期望值相同（都是 5 萬）時，光看 E(X) 無法做決定，這時 σ 才是關鍵。A 的波動（43.8 萬）約是 B（11 萬）的 4 倍。\u003cbr>\u003cb>期望值告訴你「平均會怎樣」，變異數告訴你「可能偏離多遠」，兩個都要看。\u003c/b>標準差大只代表不確定性高，不代表報酬高。"},{"id":"M11","topic":"期望值與變異數","src":"P.18 期望值 E(X)：分配的長期平均","lecture":false,"q":"若 E(X) = 3、Var(X) = 2，令 Y = 5X + 10，則 E(Y) 是多少？","table":null,"opts":["25","15","35","20"],"ans":0,"exp":"期望值具有線性性質：E(aX + b) = a·E(X) + b。\u003cbr>E(Y) = 5(3) + 10 = 15 + 10 = \u003cb>25\u003c/b>。\u003cbr>順帶一提變異數的規則不同：Var(aX + b) = a²·Var(X) = 25(2) = 50 —— \u003cb>常數 b 不影響變異數\u003c/b>（整體平移不改變離散程度），但係數 a 要平方。"},{"id":"M12","topic":"期望值與變異數","src":"P.19 變異數 Var(X) 與標準差 σ","lecture":false,"q":"某離散隨機變數以「萬元」為單位，算得 Var(X) = 16。關於標準差 σ，下列敘述何者正確？","table":null,"opts":["σ = 16 萬元","σ = 4 萬元，與 X 同單位","σ = 4 平方萬元","σ = 256 萬元"],"ans":1,"exp":"σ = √Var(X) = √16 = \u003cb>4 萬元\u003c/b>。\u003cbr>變異數的單位是原單位的\u003cb>平方\u003c/b>（平方萬元），沒辦法直接解讀；開根號之後的標準差回到原單位，所以實務報告幾乎都報 σ 而不是 σ²。這一點和第 3 章描述統計的標準差完全一樣。"},{"id":"M13","topic":"期望值與變異數","src":"P.20 DiCarlo 的期望值與變異數（表格法）","lecture":true,"q":"承上題手機行的分配，已算出 μ = 1.81、E(X²) = 4.83。Var(X) 是多少？","table":null,"opts":["1.5539","4.83","3.02","1.2466"],"ans":0,"exp":"用捷徑公式：Var(X) = E(X²) − μ² = 4.83 − 1.81² = 4.83 − 3.2761 = \u003cb>1.5539\u003c/b>。\u003cbr>標準差 σ = √1.5539 = 1.2466 台。\u003cbr>(C) 是把 μ² 誤寫成 μ 的常見錯誤 —— 減掉的是\u003cb>平均數的平方\u003c/b>。"},{"id":"M14","topic":"二項分配","src":"P.25 二項實驗的四個條件","lecture":true,"q":"下列哪一個\u003cb>不是\u003c/b>二項實驗必須滿足的條件？","table":null,"opts":["試驗次數 n 固定","每次試驗只有成功、失敗兩種結果","每次試驗的成功機率 p 都相同","成功次數 X 必須服從均勻分配"],"ans":3,"exp":"二項實驗的四個條件：\u003cb>①\u003c/b> n 次試驗固定　\u003cb>②\u003c/b> 每次只有兩種結果　\u003cb>③\u003c/b> 每次成功機率 p 不變　\u003cb>④\u003c/b> 各次試驗互相獨立。\u003cbr>X 的分配形狀是這四個條件推導出來的\u003cb>結果\u003c/b>，不是前提；而且二項分配一般不是均勻的。"},{"id":"M15","topic":"二項分配","src":"P.25 二項實驗的四個條件","lecture":false,"q":"從一副 52 張的撲克牌中\u003cb>不放回\u003c/b>連抽 5 張，令 X 為抽到紅心的張數。X 服從二項分配嗎？","table":null,"opts":["是，因為只有紅心與非紅心兩種結果","不是，因為不放回使各次抽牌不獨立，且 p 會改變","是，因為 n = 5 固定","不是，因為 52 張牌的樣本數太大"],"ans":1,"exp":"不放回抽樣會\u003cb>同時破壞第三與第四個條件\u003c/b>：抽走一張紅心後，下一次抽到紅心的機率從 13/52 降為 12/51，p 變了，而且各次結果互相影響，不再獨立。\u003cbr>這種情形要改用\u003cb>超幾何分配\u003c/b>。若改成「抽完放回再抽」，就完全符合二項了。"},{"id":"M16","topic":"二項分配","src":"P.26 二項機率公式","lecture":true,"q":"某門市每位進店顧客成交的機率為 0.25，今天隨機觀察 4 位顧客。恰好有 1 位成交的機率，下列代入式何者正確？","table":null,"opts":["C(4,1) × 0.25¹ × 0.75^4","C(4,1) × 0.25¹ × 0.75^3","C(4,1) × 0.75¹ × 0.25^3","4 × 0.25¹ × 0.75^4"],"ans":1,"exp":"公式是 f(x) = C(n,x)·pˣ·(1−p)\u003csup>n−x\u003c/sup>。此處 n = 4、x = 1、p = 0.25，所以失敗次數的指數是 \u003cb>n − x = 4 − 1 = 3\u003c/b>，不是 4。\u003cbr>算出來 f(1) = 4 × 0.25 × 0.421875 = \u003cb>0.4219\u003c/b>。\u003cbr>把指數寫成 n 是最常見的失分點，講義在練習 4 特別提醒過。"},{"id":"M17","topic":"二項分配","src":"P.30 練習 4 解答：二項分配","lecture":true,"q":"資安系統標記的可疑連線中有 15% 是真正的攻擊。隨機抽 8 筆人工複核，「至少有 1 筆是真正攻擊」的機率最快的算法是？","table":null,"opts":["f(1)","f(1) + f(2) + … + f(8)","1 − f(0)","1 − f(1)"],"ans":2,"exp":"「至少 1 筆」= 1 − 「一筆都沒有」= 1 − f(0)。\u003cbr>1 − C(8,0)×0.15⁰×0.85^8 = 1 − 0.272491 = \u003cb>0.7275\u003c/b>。\u003cbr>(B) 答案正確但要算 8 次；用餘集只要算一次。(A) 把「至少 1」誤寫成「恰好 1」，是本章最常見的錯誤之一。"},{"id":"M18","topic":"二項分配","src":"P.28 二項分配的期望值與變異數","lecture":true,"q":"承上題（n = 8、p = 0.15），E(X) 與 Var(X) 分別是多少？","table":null,"opts":["E(X) = 1.2，Var(X) = 1.02","E(X) = 1.2，Var(X) = 1.2","E(X) = 4，Var(X) = 1.02","E(X) = 1.2，Var(X) = 1.01"],"ans":0,"exp":"E(X) = np = 8 × 0.15 = \u003cb>1.2\u003c/b> 筆\u003cbr>Var(X) = np(1−p) = 8 × 0.15 × 0.85 = \u003cb>1.02\u003c/b>\u003cbr>σ = √1.02 = 1.01 筆\u003cbr>(B) 是把卜瓦松的 E = Var 誤套到二項；(D) 把標準差當成變異數。"},{"id":"M19","topic":"二項分配","src":"P.28 二項分配的期望值與變異數","lecture":false,"q":"二項分配的 n 固定時，Var(X) = np(1−p) 在 p 等於多少時最大？","table":null,"opts":["p = 0","p = 0.5","p = 1","p 越大變異數越大，沒有最大值"],"ans":1,"exp":"np(1−p) 看成 p 的二次函數，開口向下，對稱軸在 \u003cb>p = 0.5\u003c/b>，此時 Var = n/4 達到最大。\u003cbr>直覺上也合理：\u003cb>五五波最難預測\u003c/b>。p = 0.99 的事情幾乎每次都成功，結果很穩定，變異數接近 0；p = 0.01 也一樣穩定（幾乎都失敗）。"},{"id":"M20","topic":"二項分配","src":"P.27 馬丁服飾店：n = 3、p = 0.30","lecture":true,"q":"某門市成交機率 p = 0.25，觀察 4 位顧客。恰好 2 位成交的機率約為多少？","table":null,"opts":["0.2109","0.4219","0.0469","0.1187"],"ans":0,"exp":"f(2) = C(4,2) × 0.25² × 0.75² = 6 × 0.0625 × 0.5625 = \u003cb>0.2109\u003c/b>。\u003cbr>完整分配：f(0) = 0.3164、f(1) = 0.4219、f(2) = 0.2109、f(3) = 0.0469、f(4) = 0.0039，總和 = 1 ✓"},{"id":"M21","topic":"卜瓦松分配","src":"P.31 卜瓦松分配：數「一段區間內發生幾次」","lecture":true,"q":"二項分配與卜瓦松分配最關鍵的差別是什麼？","table":null,"opts":["二項用在離散變數，卜瓦松用在連續變數","二項數「固定 n 次裡成功幾次」有上限 n；卜瓦松數「一段區間內發生幾次」沒有上限","二項不需要獨立假設，卜瓦松才需要","卜瓦松的期望值一定大於二項的期望值"],"ans":1,"exp":"兩者\u003cb>數的東西不一樣\u003c/b>。二項的 X 只能是 0 到 n；卜瓦松的 X 可以一直數下去，沒有上限。\u003cbr>辨別訣竅：題目說「\u003cb>做 n 次、每次機率 p\u003c/b>」→ 二項；說「\u003cb>平均每＿＿發生幾次\u003c/b>」→ 卜瓦松。兩者都是離散型，也都需要獨立假設。"},{"id":"M22","topic":"卜瓦松分配","src":"P.33 區間換算：本章最常見的失分點","lecture":true,"q":"某資訊中心客服專線平均每 20 分鐘接到 5 通電話。若要計算「某個 8 分鐘內」的來電機率，公式中的 μ 應該是多少？","table":null,"opts":["5","2","0.625","40"],"ans":1,"exp":"公式裡的 μ 必須是「\u003cb>題目所問的那一段區間\u003c/b>」的平均發生次數。\u003cbr>每分鐘平均 5 ÷ 20 = 0.25 通 → 8 分鐘平均 0.25 × 8 = \u003cb>2\u003c/b> 通。\u003cbr>(A) 是直接把 5 代進去，正是本章最常見的失分點。\u003cb>μ 換錯，後面全錯，而且計算機不會報錯。\u003c/b>"},{"id":"M23","topic":"卜瓦松分配","src":"P.35 練習 5 解答：卜瓦松分配","lecture":true,"q":"承上題（μ = 2），該 8 分鐘內\u003cb>一通電話都沒有\u003c/b>的機率是多少？","table":null,"opts":["0.1353","0","0.2707","0.8647"],"ans":0,"exp":"f(0) = μ⁰·e^(−μ) ÷ 0! = 1 × 0.135335 ÷ 1 = \u003cb>0.1353\u003c/b>。\u003cbr>關鍵：\u003cb>μ⁰ = 1 且 0! = 1\u003c/b>，兩個都等於 1，所以 f(0) 就是 e^(−μ)。\u003cbr>(B) 以為「平均 2 通所以不可能是 0 通」是錯的；(D) 是「至少 1 通」= 1 − f(0) = 0.8647。"},{"id":"M24","topic":"卜瓦松分配","src":"P.37 三種分配怎麼選","lecture":false,"q":"關於卜瓦松分配的期望值與變異數，下列敘述何者正確？","table":null,"opts":["E(X) = μ，Var(X) = μ²","E(X) = μ，Var(X) = μ，兩者相等","E(X) = μ，Var(X) = √μ","E(X) = μ，Var(X) = μ(1 − μ)"],"ans":1,"exp":"卜瓦松分配的 \u003cb>E(X) = Var(X) = μ\u003c/b>，標準差 σ = √μ。這是它最好認的特徵。\u003cbr>實務上可以拿來\u003cb>檢查模型是否適用\u003c/b>：算出樣本平均與樣本變異數比一比，兩者差不多才適合用卜瓦松；若變異數明顯大於平均，表示事件有叢聚現象（例如當機往往一次連三台），卜瓦松會低估尾端風險。\u003cbr>(D) 是把二項的 np(1−p) 誤套過來。"},{"id":"M25","topic":"卜瓦松分配","src":"P.32 收費站：15 分鐘平均 10 輛車","lecture":true,"q":"某機房門禁系統平均每 30 分鐘有 12 人次刷卡進入。某一個 30 分鐘內恰好有 5 人次刷卡的機率約為多少？","table":null,"opts":["0.0127","0.1144","0.1954","0.000006"],"ans":0,"exp":"問的區間就是 30 分鐘，與題目給的區間一致，μ = 12 \u003cb>不必換算\u003c/b>。\u003cbr>f(5) = 12⁵ × e^(−12) ÷ 5! = 248832 × 0.00000614 ÷ 120 = \u003cb>0.0127\u003c/b>。\u003cbr>注意這是「\u003cb>恰好\u003c/b> 5 人次」，不是「5 人次以內」。"},{"id":"M26","topic":"卜瓦松分配","src":"P.36 伺服器要準備多少容量？","lecture":true,"q":"某 API 服務平均每秒收到 4 個請求，伺服器同一秒最多處理 7 個，超過就拒絕。某位同學說「平均才 4 個、容量有 7 個，綽綽有餘」。這個推論的問題是什麼？","table":null,"opts":["推論正確，7 > 4 確實足夠","平均值掩蓋了尾端；P(X ≥ 8) ≈ 0.0511，一天約有 4,420 秒會拒絕請求","應該改用二項分配才算得出來","卜瓦松分配不能用在每秒請求數上"],"ans":1,"exp":"P(X ≥ 8) = 1 − P(X ≤ 7) ≈ \u003cb>0.0511\u003c/b>，約每 20 秒就有一秒會拒絕到請求。\u003cbr>一天 86,400 秒裡大約有 \u003cb>4,420 秒\u003c/b>處於滿載拒絕狀態，對線上服務來說太高了。\u003cbr>\u003cb>只看平均值會完全低估風險，要看整張分配的尾端。\u003c/b>這和第 3 章「只看平均數會誤判」是同一個教訓。"},{"id":"M27","topic":"分配選擇與綜合判斷","src":"P.37 三種分配怎麼選","lecture":true,"q":"下列哪一個情境\u003cb>最適合\u003c/b>用二項分配？","table":null,"opts":["某網站每分鐘的到訪人次","隨機抽查 20 件產品，其中不良品的件數（不良率固定為 3%）","從 100 件產品中不放回抽 10 件的不良品數","擲一顆公正骰子出現的點數"],"ans":1,"exp":"二項的關鍵字是「\u003cb>做 n 次、每次成功機率 p\u003c/b>」：n = 20 固定、不良／良品兩種結果、p = 0.03 固定、各件獨立 ✓\u003cbr>(A) 是「平均每＿＿發生幾次」→ 卜瓦松；(C) 不放回破壞獨立 → 超幾何；(D) 每個結果機會均等 → 離散型均勻分配。"},{"id":"M28","topic":"分配選擇與綜合判斷","src":"P.37 三種分配怎麼選","lecture":true,"q":"拿到一個題目時，判斷該用二項還是卜瓦松，最可靠的切入點是？","table":null,"opts":["看題目數字的大小，數字大用卜瓦松","看題目有沒有給「試驗次數 n」：給了 n 與 p 用二項；只給「平均每＿＿幾次」用卜瓦松","看答案要不要四捨五入","看 X 是不是整數"],"ans":1,"exp":"\u003cb>先找 n。\u003c/b>題目若能明確指出「做了幾次」（抽 20 件、觀察 4 位顧客），而且每次成功機率固定，就是二項，X 的範圍是 0 到 n。\u003cbr>若題目只給「平均每 15 分鐘 10 輛」這種\u003cb>發生率\u003c/b>，根本數不出 n 是多少，就是卜瓦松，X 沒有上限。\u003cbr>兩者的 X 都是整數，數字大小也不是判準。"}],"calc":[{"id":"C01","topic":"隨機變數與機率分配","src":"P.15 練習 2：機率分配與事件機率","lecture":true,"stem":"某影音 App 記錄「使用者單次開啟所觀看的影片數」X，依過去資料整理出下列分配：","table":{"head":["x（部）","0","1","2","3","4"],"rows":[["f(x)","0.08","0.22","0.34","0.24","0.12"]]},"parts":[{"label":"(1)","type":"text","q":"先檢查：這是一個合法的機率分配嗎？請寫出你依據的兩個條件。","ref":"合法。條件一：每個 f(x) 都 ≥ 0 ✓。條件二：總和 = 0.08 + 0.22 + 0.34 + 0.24 + 0.12 = 1 = 1 ✓。","rubric":["寫出「f(x) ≥ 0」這個條件","寫出「Σf(x) = 1」這個條件","實際把五個機率加起來驗算，而不是只說「看起來沒問題」"]},{"label":"(2)","type":"num","unit":"","q":"P(X ≥ 2) 是多少？也就是「至少觀看 2 部」的機率。","ans":0.7,"tol":0.001,"sol":"X ≥ 2 包含 x = 2, 3, 4（\u003cb>含 2\u003c/b>）：0.34 + 0.24 + 0.12 = \u003cb>0.7\u003c/b>"},{"label":"(3)","type":"num","unit":"","q":"P(1 ≤ X ≤ 3) 是多少？請先圈出屬於這個事件的 x 值再相加。","ans":0.8,"tol":0.001,"sol":"兩端都含，x = 1, 2, 3：0.22 + 0.34 + 0.24 = \u003cb>0.8\u003c/b>"},{"label":"(4)","type":"text","q":"若產品團隊的目標是「七成以上的使用者至少看 2 部」，根據這張表，目標達成了嗎？","ref":"沒有達成。至少看 2 部的比例是 7%，離目標 70% 還差 0 個百分點。團隊該做的是改善推薦演算法，而不是改目標。","rubric":["明確回答「沒有達成」","引用 (2) 算出的 0.7 作為依據","寫出與 70% 的差距"]}],"note":"(2) 的「至少 2 部」含 2；若題目改寫成「超過 2 部」就不含 2，答案會變成 0.36。一字之差，答案差了 0.34。"},{"id":"C02","topic":"期望值與變異數","src":"P.22 練習 3：期望值與變異數","lecture":true,"stem":"沿用上一題影音 App 的分配（單次開啟觀看的影片數 X）：","table":{"head":["x（部）","0","1","2","3","4"],"rows":[["f(x)","0.08","0.22","0.34","0.24","0.12"]]},"parts":[{"label":"(1)","type":"num","unit":"部","q":"計算期望值 E(X)。","ans":2.1,"tol":0.01,"sol":"E(X) = Σ x·f(x) = 0(0.08) + 1(0.22) + 2(0.34) + 3(0.24) + 4(0.12) = \u003cb>2.1\u003c/b> 部\u003cbr>解讀：平均每次開啟 App 會看約 2 部影片。"},{"label":"(2)","type":"num","unit":"","q":"用表格求解法計算 Var(X)（請在紙上附上完整的五欄表格）。","ans":1.25,"tol":0.001,"sol":"σ² = Σ(x − μ)²·f(x) = \u003cb>1.25\u003c/b>（完整表格見下方）","wide":{"head":["x","f(x)","x·f(x)","x − μ","(x − μ)²","(x − μ)²·f(x)","x²·f(x)"],"rows":[["0","0.08","0","-2.1","4.41","0.3528","0"],["1","0.22","0.22","-1.1","1.21","0.2662","0.22"],["2","0.34","0.68","-0.1","0.01","0.0034","1.36"],["3","0.24","0.72","0.9","0.81","0.1944","2.16"],["4","0.12","0.48","1.9","3.61","0.4332","1.92"],["合計","1.00","μ = 2.1","—","—","σ² = 1.25","E(X²) = 5.66"]]}},{"label":"(3)","type":"num","unit":"部","q":"計算標準差 σ。","ans":1.118,"tol":0.01,"sol":"σ = √Var(X) = √1.25 = \u003cb>1.118\u003c/b> ≈ 1.12 部"},{"label":"(4)","type":"num","unit":"","q":"用捷徑公式 Var(X) = E(X²) − μ² 再算一次，確認兩種算法結果相同。請填入 E(X²)。","ans":5.66,"tol":0.01,"sol":"E(X²) = Σ x²·f(x) = 5.66\u003cbr>驗算：E(X²) − μ² = 5.66 − 2.1² = 5.66 − 4.41 = \u003cb>1.25\u003c/b> ✓ 與 (2) 完全一致"},{"label":"(5)","type":"text","q":"若 App 改版後 E(X) 上升到 2.6 部但 σ 也從原本的值上升到 1.8 部，這代表什麼？","ref":"平均觀看部數變多是好事（從 2.1 升到 2.6），但 σ 也從 1.12 升到 1.8，表示使用者行為更\u003cb>分化\u003c/b> —— 可能一部分人看得更多、另一部分人反而更快離開。改版成效要分群再看，不能只看平均。","rubric":["指出平均上升是正面訊號","指出 σ 上升代表波動／分化變大","提出「只看平均會蓋掉分化」或建議分群分析"]}],"note":"(4) 的捷徑公式減掉的是「平均數的平方」μ²，不是 μ。這是改卷時最常見的扣分點。"},{"id":"C03","topic":"期望值與變異數","src":"P.13 由相對次數建立機率分配（DiCarlo）","lecture":true,"stem":"某手機行統計過去 300 個營業日的每日銷售量 X，天數紀錄如下表。","table":{"head":["x（台）","0","1","2","3","4","5"],"rows":[["天數","36","108","75","48","24","9"]]},"parts":[{"label":"(1)","type":"num","unit":"","q":"用相對次數法建立機率分配，f(1) 是多少？","ans":0.36,"tol":0.001,"sol":"f(x) = 天數 ÷ 300，所以 f(1) = 108 ÷ 300 = \u003cb>0.36\u003c/b>\u003cbr>完整分配：f(0) = 0.12、f(1) = 0.36、f(2) = 0.25、f(3) = 0.16、f(4) = 0.08、f(5) = 0.03"},{"label":"(2)","type":"text","q":"檢查這是否為合法的機率分配。","ref":"合法。六個 f(x) 都 ≥ 0 ✓；總和 = 0.12 + 0.36 + 0.25 + 0.16 + 0.08 + 0.03 = 1 ✓","rubric":["寫出兩個條件","實際加總驗算"]},{"label":"(3)","type":"num","unit":"台","q":"計算 E(X)，並用一句話解讀。","ans":1.81,"tol":0.01,"sol":"E(X) = 0(0.12) + 1(0.36) + 2(0.25) + 3(0.16) + 4(0.08) + 5(0.03) = \u003cb>1.81\u003c/b> 台\u003cbr>解讀：長期而言平均每日賣出約 1.81 台。"},{"label":"(4)","type":"num","unit":"","q":"計算 Var(X)。","ans":1.5539,"tol":0.001,"sol":"E(X²) = 4.83\u003cbr>Var(X) = E(X²) − μ² = 4.83 − 1.81² = \u003cb>1.5539\u003c/b>\u003cbr>σ = 1.2466 台"},{"label":"(5)","type":"text","q":"店長說「平均每天賣 2 台以上」。根據這張分配，這句話對嗎？","ref":"不對。E(X) = 1.81 台，不到 2 台。另外「賣 2 台以上」的機率 P(X ≥ 2) = 0.52，也只有約 52%。無論用期望值還是用機率解讀，這句話都站不住。","rubric":["算出並引用 E(X) = 1.81","明確回答「不對」","（加分）另外算出 P(X ≥ 2) 佐證"]}],"note":null},{"id":"C04","topic":"期望值與變異數","src":"P.21 期望值怎麼用在決策上","lecture":true,"stem":"某資訊公司評估兩個系統維護外包方案，年度淨利（萬元）的機率分配如下：","table":{"head":["方案","淨利 x","機率 f(x)","淨利 x","機率 f(x)","淨利 x","機率 f(x)"],"rows":[["A","-30","0.2","50","0.4","90","0.4"],["B","40","0.4","50","0.4","70","0.2"]]},"parts":[{"label":"(1)","type":"num","unit":"萬元","q":"計算 A 案的期望淨利 E(X_A)。","ans":50.0,"tol":0.01,"sol":"E(X_A) = (-30)(0.2) + (50)(0.4) + (90)(0.4) = \u003cb>50\u003c/b> 萬元"},{"label":"(2)","type":"num","unit":"萬元","q":"計算 B 案的期望淨利 E(X_B)。","ans":50.0,"tol":0.01,"sol":"E(X_B) = (40)(0.4) + (50)(0.4) + (70)(0.2) = \u003cb>50\u003c/b> 萬元\u003cbr>兩案期望值相同，光看 E(X) 無法做決定。"},{"label":"(3)","type":"num","unit":"萬元","q":"計算 A 案的標準差 σ_A。","ans":43.82,"tol":0.5,"sol":"Var(X_A) = Σ(x − μ)²f(x) = 1920，σ_A = √1920 = \u003cb>43.82\u003c/b> 萬元"},{"label":"(4)","type":"num","unit":"萬元","q":"計算 B 案的標準差 σ_B。","ans":10.95,"tol":0.5,"sol":"Var(X_B) = 120，σ_B = \u003cb>10.95\u003c/b> 萬元\u003cbr>A 的波動約是 B 的 4 倍。"},{"label":"(5)","type":"text","q":"若你是決策者，會選哪一案？請以 E(X) 與 σ 為依據說明理由。","ref":"兩案期望淨利相同（都是 5 萬），差別在風險。σ_A ≈ 43.8 萬，σ_B ≈ 11 萬，A 的波動是 B 的 4 倍，而且 A 有 2% 的機率會虧 30 萬。\u003cbr>保守的決策者應選 B：期望報酬一樣但幾乎不會虧錢。能承受風險者才考慮 A，因為它有 4% 的機會賺到 90 萬。\u003cb>答哪一案都可以，關鍵是有沒有同時引用 E(X) 與 σ。\u003c/b>","rubric":["指出兩案 E(X) 相同","引用兩個 σ 的數值做比較","說明自己的風險偏好立場（保守／可承受風險）","（加分）指出 A 有虧損的可能"]}],"note":"兩案期望值刻意設計成相同，逼你去看 σ。期望值告訴你「平均會怎樣」，變異數告訴你「可能偏離多遠」，兩個都要看。"},{"id":"C05","topic":"二項分配","src":"P.27 馬丁服飾店：n = 3、p = 0.30","lecture":true,"stem":"某門市根據過去經驗，每位進店顧客有 25% 會完成購買。今天隨機觀察 4 位進店顧客，令 X 為完成購買的人數。","table":null,"parts":[{"label":"(1)","type":"text","q":"請逐條檢查這個情境是否符合二項實驗的四個條件，並寫出 n 與 p。","ref":"符合，n = 4、p = 0.25。① 觀察 4 位固定 ✓　② 每位只有買／不買兩種結果 ✓　③ p = 0.25 每位都相同 ✓　④ 顧客之間互不影響（獨立）✓","rubric":["四個條件逐條檢查，不是只寫「符合」","明確寫出 n = 4","明確寫出 p = 0.25"]},{"label":"(2)","type":"num","unit":"","q":"恰好有 2 位完成購買的機率是多少？請寫出完整代入過程。","ans":0.2109,"tol":0.001,"sol":"f(2) = C(4,2) × 0.25² × 0.75\u003csup>4−2\u003c/sup> = 6 × 0.0625 × 0.5625 = \u003cb>0.2109\u003c/b>\u003cbr>注意失敗次數的指數是 n − x = 4 − 2 = 2。"},{"label":"(3)","type":"num","unit":"","q":"至少有 1 位完成購買的機率是多少？（提示：用餘集）","ans":0.6836,"tol":0.001,"sol":"P(X ≥ 1) = 1 − f(0) = 1 − C(4,0) × 0.25⁰ × 0.75\u003csup>4\u003c/sup> = 1 − 0.316406 = \u003cb>0.6836\u003c/b>\u003cbr>若硬算 f(1)+f(2)+f(3)+f(4) 要算四次，用餘集只要算一次。"},{"label":"(4)","type":"num","unit":"位","q":"計算 E(X)。","ans":1.0,"tol":0.01,"sol":"E(X) = np = 4 × 0.25 = \u003cb>1\u003c/b> 位"},{"label":"(5)","type":"num","unit":"位","q":"計算標準差 σ。","ans":0.866,"tol":0.01,"sol":"Var(X) = np(1−p) = 4 × 0.25 × 0.75 = 0.75\u003cbr>σ = √0.75 = \u003cb>0.866\u003c/b> 位"}],"note":null},{"id":"C06","topic":"二項分配","src":"P.29 練習 4：二項分配","lecture":true,"stem":"某企業的資安監控系統每天會標記一批「可疑連線」。根據過去紀錄，被標記的可疑連線中有 15% 是真正的攻擊。今天隨機抽出 8 筆可疑連線進行人工複核，令 X 為其中真正是攻擊的筆數。","table":null,"parts":[{"label":"(1)","type":"num","unit":"","q":"恰好有 2 筆是真正攻擊的機率是多少？","ans":0.2376,"tol":0.001,"sol":"f(2) = C(8,2) × 0.15² × 0.85\u003csup>6\u003c/sup> = 28 × 0.0225 × 0.37715 = \u003cb>0.2376\u003c/b>"},{"label":"(2)","type":"num","unit":"","q":"一筆都不是真正攻擊的機率是多少？","ans":0.2725,"tol":0.001,"sol":"f(0) = 0.85\u003csup>8\u003c/sup> = \u003cb>0.2725\u003c/b>"},{"label":"(3)","type":"num","unit":"","q":"至少有 1 筆是真正攻擊的機率是多少？","ans":0.7275,"tol":0.001,"sol":"P(X ≥ 1) = 1 − f(0) = 1 − 0.272491 = \u003cb>0.7275\u003c/b>\u003cbr>最常見的錯誤是把「至少 1 筆」寫成 f(1)。看到「至少」一律先想餘集。"},{"label":"(4)","type":"num","unit":"筆","q":"計算 E(X)。","ans":1.2,"tol":0.01,"sol":"E(X) = np = 8 × 0.15 = \u003cb>1.2\u003c/b> 筆"},{"label":"(5)","type":"text","q":"用一句話解讀 E(X) 對資安團隊的管理意義。","ref":"每複核 8 筆可疑連線，平均只會抓到約 1.2 筆真正的攻擊，也就是約 85% 的人工複核工時花在誤報上。這正是資安團隊必須持續調整偵測規則、降低誤報率的原因 —— 否則人力會被誤報吃光。","rubric":["引用 E(X) = 1.2 筆這個數字","把它翻譯成「多少工時花在誤報上」之類的管理語言","（加分）連結到降低誤報率的行動建議"]}],"note":"這題的誤報問題和第 4 章貝氏定理的垃圾郵件誤殺率是同一個管理問題，期中考可能合併考。"},{"id":"C08","topic":"卜瓦松分配","src":"P.34 練習 5：卜瓦松分配","lecture":true,"stem":"某校園網路的資訊中心客服專線，根據過去一學期的紀錄，平均每 20 分鐘會接到 5 通求助電話。假設來電符合卜瓦松分配的兩個性質。","table":null,"parts":[{"label":"(1)","type":"num","unit":"通","q":"若要分析「8 分鐘內」的來電情形，μ 應該換算成多少？請寫出換算過程。","ans":2.0,"tol":0.01,"sol":"每分鐘平均 5 ÷ 20 = 0.25 通\u003cbr>8 分鐘平均 0.25 × 8 = \u003cb>2\u003c/b> 通\u003cbr>\u003cb>這一步算錯，後面全錯而且計算機不會報錯。\u003c/b>"},{"label":"(2)","type":"num","unit":"","q":"某個 8 分鐘內恰好接到 2 通電話的機率是多少？","ans":0.2707,"tol":0.001,"sol":"f(2) = 2² × e^(−2) ÷ 2! = 4 × 0.135335 ÷ 2 = \u003cb>0.2707\u003c/b>"},{"label":"(3)","type":"num","unit":"","q":"某個 8 分鐘內一通電話都沒有的機率是多少？","ans":0.1353,"tol":0.001,"sol":"f(0) = 2⁰ × e^(−2) ÷ 0! = 1 × 0.135335 ÷ 1 = \u003cb>0.1353\u003c/b>\u003cbr>注意 μ⁰ = 1 且 \u003cb>0! = 1\u003c/b>，兩個都是 1，所以 f(0) 就是 e^(−μ)。"},{"label":"(4)","type":"text","q":"承 (3)，若值班人員想利用空檔處理其他事務，依這個機率你會建議他怎麼安排？","ref":"沒來電的機率只有 13.5%，換句話說約 86% 的 8 分鐘區段至少會有一通電話。因此不宜安排會被打斷的連續性工作（例如寫程式、處理需要專注的文件），適合安排可以隨時中斷的瑣事。","rubric":["引用 (3) 算出的 0.1353 或其反面 0.8647","給出具體可執行的排班建議","理由與機率數字有連結，不是空泛描述"]}],"note":"(1) 的區間換算是本章最常見的失分點，也是期中考高頻考點。考試時第一個動作：圈出題目問的區間，把 μ 換算好寫在旁邊，再動筆代公式。"},{"id":"C09","topic":"卜瓦松分配","src":"P.32 收費站：15 分鐘平均 10 輛車","lecture":true,"stem":"某資料中心的門禁系統紀錄顯示，平均每 30 分鐘有 12 人次刷卡進入機房。","table":null,"parts":[{"label":"(1)","type":"num","unit":"","q":"某一個 30 分鐘內恰好有 5 人次刷卡的機率是多少？","ans":0.0127,"tol":0.001,"sol":"問的區間與題目給的區間一致，μ = 12 不必換算。\u003cbr>f(5) = 12⁵ × e^(−12) ÷ 5! = 248832 × 0.00000614 ÷ 120 = \u003cb>0.0127\u003c/b>"},{"label":"(2)","type":"num","unit":"人次","q":"若改問「10 分鐘內」的情形，μ 應換算成多少？","ans":4.0,"tol":0.01,"sol":"每分鐘 12 ÷ 30 = 0.4 人次 → 10 分鐘 0.4 × 10 = \u003cb>4\u003c/b> 人次"},{"label":"(3)","type":"num","unit":"","q":"某個 10 分鐘內恰好有 3 人次刷卡的機率是多少？","ans":0.1954,"tol":0.001,"sol":"f(3) = 4³ × e^(−4) ÷ 3! = 64 × 0.018316 ÷ 6 = \u003cb>0.1954\u003c/b>"},{"label":"(4)","type":"text","q":"(1) 的答案（30 分鐘 5 人次）與 (3) 的答案（10 分鐘 3 人次）哪一個大？為什麼同一個來訪率會得到不同的機率？","ref":"(3) 比較大（0.1954 > 0.0127）。\u003cbr>兩者描述的是同一個來訪率，但\u003cb>問的區間不同，μ 就不同\u003c/b>（12 vs 4），分配整個不一樣。\u003cbr>而且 (1) 問的 5 人次離 μ = 12 很遠，落在尾端所以機率低；(3) 問的 3 人次離 μ = 4 很近，落在中心所以機率高。區間拉長，分配會變得更分散，剛好落在某一個數字上的機率反而下降。","rubric":["正確比較出大小","指出兩題的 μ 不同","（加分）用「離 μ 遠近」或「區間拉長分配變分散」解釋"]}],"note":null},{"id":"C10","topic":"分配選擇與綜合判斷","src":"P.36 伺服器要準備多少容量？","lecture":true,"stem":"某系統的 API 服務平均每秒收到 4 個請求。伺服器目前的設定是「同一秒最多處理 7 個請求」，超過的就會被拒絕。","table":{"head":["每秒請求數 x","0","1","2","3","4","5","6","7","8 以上"],"rows":[["f(x)（μ = 4）","0.0183","0.0733","0.1465","0.1954","0.1954","0.1563","0.1042","0.0595","0.0511"]]},"parts":[{"label":"(1)","type":"num","unit":"","q":"某一秒內恰好收到 4 個請求的機率是多少？","ans":0.1954,"tol":0.001,"sol":"f(4) = 4⁴ × e^(−4) ÷ 4! = 256 × 0.018316 ÷ 24 = \u003cb>0.1954\u003c/b>"},{"label":"(2)","type":"num","unit":"","q":"某一秒內請求被拒絕（即 X ≥ 8）的機率是多少？","ans":0.0511,"tol":0.002,"sol":"P(X ≥ 8) = 1 − P(X ≤ 7) = 1 − 0.9489 = \u003cb>0.0511\u003c/b>\u003cbr>約每 20 秒就有一秒會拒絕到請求。"},{"label":"(3)","type":"num","unit":"秒","q":"一天有 86,400 秒，預估一天中大約有多少秒處於滿載拒絕狀態？","ans":4418.0,"tol":200,"sol":"0.0511 × 86,400 ≈ \u003cb>4,418\u003c/b> 秒"},{"label":"(4)","type":"text","q":"某位同學說「平均才 4 個請求、容量有 7 個，綽綽有餘」。請評論這個說法，並提出管理上的建議。","ref":"這個說法低估了風險。只看平均值 4 會忽略分配的\u003cb>尾端\u003c/b>：實際上有 5.11% 的秒數會超過容量，一天約 4,418 秒處於拒絕狀態，對線上服務而言太高。\u003cbr>管理建議：提高處理容量，或加上佇列緩衝讓超量請求排隊而非直接拒絕。\u003cb>這個決定的依據是整張分配，而不是平均值。\u003c/b>","rubric":["明確指出這個說法有問題","引用 (2) 或 (3) 的數字佐證","提出具體建議（提高容量或加佇列）","（加分）點出「平均值掩蓋尾端」這個觀念"]}],"note":"如果老闆只給你「平均每秒 4 個」這個數字，你敢不敢簽 SLA？這題和第 3 章「只看平均數會誤判」是同一個教訓。"},{"id":"C11","topic":"分配選擇與綜合判斷","src":"P.37 三種分配怎麼選","lecture":true,"stem":"下列三個情境分別應該用哪一種離散機率分配？請寫出分配名稱、參數，並簡述判斷依據。","table":null,"parts":[{"label":"(1)","type":"text","q":"情境一：隨機抽查 20 件出廠產品，已知長期不良率為 3%，令 X 為不良品件數。","ref":"\u003cb>二項分配\u003c/b>，n = 20、p = 0.03。\u003cbr>依據：題目明確給了試驗次數 n = 20，每件只有良品／不良品兩種結果，p 固定且各件獨立，X 的範圍是 0 到 20（有上限）。","rubric":["答出二項分配","寫出 n = 20 與 p = 0.03","說明依據（有固定 n、兩種結果、p 固定、獨立）"]},{"label":"(2)","type":"text","q":"情境二：某電商網站平均每分鐘有 25 人次到訪，令 X 為某一分鐘內的到訪人次。","ref":"\u003cb>卜瓦松分配\u003c/b>，μ = 25（每分鐘）。\u003cbr>依據：題目給的是「平均每＿＿發生幾次」這種\u003cb>發生率\u003c/b>，根本數不出 n 是多少；X 沒有上限，可以一直數下去。","rubric":["答出卜瓦松分配","寫出 μ = 25","說明依據（給的是發生率、無上限）"]},{"label":"(3)","type":"text","q":"情境三：從裝有 10 張號碼牌（1～10）的箱子中隨機抽一張，令 X 為抽中的號碼。","ref":"\u003cb>離散型均勻分配\u003c/b>，n = 10，f(x) = 1/10 = 0.1。\u003cbr>依據：每一個結果出現的機率完全相同，這是古典機率法的典型情形。","rubric":["答出離散型均勻分配","寫出 f(x) = 1/10","說明依據（每個結果機會均等）"]},{"label":"(4)","type":"text","q":"若情境一改成「從 100 件產品中\u003cb>不放回\u003c/b>抽 20 件」，還能用原來的分配嗎？為什麼？","ref":"\u003cb>不能\u003c/b>，不放回會同時破壞兩個條件：抽走一件不良品後，下一次抽到不良品的機率就改變了（p 不固定），而且各次結果互相影響（不獨立）。\u003cbr>這種情形要改用\u003cb>超幾何分配\u003c/b>。若改成抽完放回再抽，就完全符合二項了。","rubric":["回答「不能」","指出 p 會改變或各次不獨立","（加分）點名超幾何分配，或提出「放回」可以修復"]}],"note":null},{"id":"C12","topic":"期望值與變異數","src":"P.28 二項分配的期望值與變異數","lecture":false,"stem":"下列是三個關於本章公式的觀念問題，請用文字與必要的算式作答。","table":null,"parts":[{"label":"(1)","type":"text","q":"請用「指示變數」的想法，說明二項分配為什麼 E(X) = np。","ref":"把 n 次試驗各配一個變數 I_i，第 i 次成功時 I_i = 1、失敗時 I_i = 0，則成功總次數 X = I₁ + I₂ + … + I_n。\u003cbr>單一個 I_i 的期望值 E(I_i) = 1·p + 0·(1−p) = p。\u003cbr>再用期望值的線性性質（和的期望值 = 期望值的和）：E(X) = E(I₁) + … + E(I_n) = p + p + … + p = \u003cb>np\u003c/b>。","rubric":["定義指示變數 I_i（0/1）","寫出 X = ΣI_i","算出 E(I_i) = p","用期望值相加得到 np"]},{"label":"(2)","type":"text","q":"承上，Var(X) = np(1−p) 的推導多用到了哪一個條件？為什麼這個條件不可少？","ref":"多用到\u003cb>獨立\u003c/b>。\u003cbr>因為 I_i² = I_i（0 和 1 平方不變），所以 E(I_i²) = p，Var(I_i) = E(I_i²) − [E(I_i)]² = p − p² = p(1−p)。\u003cbr>但「變異數可以相加」\u003cb>只在各 I_i 互相獨立時才成立\u003c/b>；期望值相加則永遠成立，不需要獨立。\u003cbr>這正是為什麼「獨立」被列進二項實驗的四個條件 —— 它不是裝飾，變異數公式整個靠它撐著。不放回抽樣破壞獨立，變異數就不再是 np(1−p)。","rubric":["明確指出是「獨立」","說明期望值相加不需要獨立、變異數相加才需要","（加分）算出 Var(I_i) = p(1−p)","（加分）舉不放回抽樣為反例"]},{"label":"(3)","type":"text","q":"卜瓦松分配的 E(X) = Var(X) = μ。這個性質在實務上可以怎麼用？","ref":"可以用來\u003cb>檢查卜瓦松模型是否適用\u003c/b>：拿到一組計數資料後，先算樣本平均與樣本變異數比一比。\u003cbr>兩者差不多 → 卜瓦松是合理的模型。\u003cbr>變異數\u003cb>明顯大於\u003c/b>平均 → 事件不是獨立發生的，可能有叢聚現象（例如當機往往一次連三台），此時用卜瓦松會\u003cb>低估尾端風險\u003c/b>，容量規劃會做得太樂觀。","rubric":["指出可以拿來檢查模型是否適用","說明比較樣本平均與樣本變異數","（加分）說明變異數偏大代表什麼（叢聚／不獨立）"]}],"note":"這三題是觀念題，期中考若出簡答題很可能從這裡出。重點不在背公式，而在能不能說清楚公式從哪來、什麼時候會失效。"}]};

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pickSpread(pool, n){
  // 盡量讓五大主題都被抽到：先每主題輪流各抽一題，再隨機補滿
  const byT={}; shuffle(pool).forEach(q=>{ (byT[q.topic]=byT[q.topic]||[]).push(q); });
  const keys=shuffle(Object.keys(byT)), out=[];
  let guard=0;
  while(out.length<n && guard++<500){
    let added=false;
    for(const k of keys){ if(out.length>=n) break; if(byT[k].length){ out.push(byT[k].shift()); added=true; } }
    if(!added) break;
  }
  return shuffle(out).slice(0,n);
}
const esc = s => String(s);
function tableHTML(t){
  if(!t) return '';
  let h='<div class="tw"><table><thead><tr>'+t.head.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';
  t.rows.forEach(r=>{ h+='<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>'; });
  return h+'</tbody></table></div>';
}

/* ── 出卷 ── */
function start(mode, topic){
  let mc=[], calc=[], label='';
  if(mode==='exam'){
    mc = pickSpread(DATA.mc, 10);
    calc = pickSpread(DATA.calc, 3);
    label='模擬測驗';
  } else if(mode==='drill'){
    const m=DATA.mc.filter(q=>q.topic===topic), c=DATA.calc.filter(q=>q.topic===topic);
    mc = shuffle(m).slice(0, Math.min(5, m.length));
    calc = shuffle(c).slice(0, 1);
    label='主題練習 · '+topic;
  } else {
    const ids=Object.keys(store.wrong);
    mc = shuffle(DATA.mc.filter(q=>ids.includes(q.id))).slice(0,8);
    calc = shuffle(DATA.calc.filter(q=>ids.includes(q.id))).slice(0,2);
    label='錯題複習';
  }
  // 每題各自打亂選項，並記住正解搬到哪裡
  mc = mc.map(q=>{
    const order = shuffle([0,1,2,3]);
    return {...q, order, ansAt: order.indexOf(q.ans)};
  });
  S = {mode, label, mc, calc, answers:{}, rub:{}, submitted:false, instant: mode!=='exam'};
  render();
}

}

function fmtPt(v){ return (Math.round(v*10)/10).toString(); }

function srcTag(q){
  return `<span class="tag">${q.src}</span>` + (q.lecture?`<span class="tag lec">講義範例</span>`:'');

function mcHTML(q,i){
  const a = S.answers[q.id];
  const done = S.submitted || (S.instant && a!==undefined);
  const letters=['A','B','C','D'];
  const opts = q.order.map((oi,k)=>{
    let cls='opt';
    if(done){
      if(k===q.ansAt) cls+=' ok';
      else if(a===k) cls+=' no';
    }
    return `<button class="${cls}" data-q="${q.id}" data-k="${k}" ${done?'disabled':''}
      aria-pressed="${a===k}"><span class="k">${letters[k]}</span><span class="v">${q.opts[oi]}</span></button>`;
  }).join('');
  let sol='';
  if(done){
    const right = a===q.ansAt;
    sol=`<div class="sol ${right?'good':'bad'}"><span class="lab">${
      a===undefined?'未作答　正解 '+letters[q.ansAt]
      : right?'答對':'答錯　正解 '+letters[q.ansAt]}</span>${q.exp}</div>`;
  }
  return `<section class="q is-mc" id="sec_${q.id}"><div class="qhead"><span class="qno">${i+1}</span>${srcTag(q)}
    ${done?`<span class="verdict ${a===q.ansAt?'ok':'no'}">${a===q.ansAt?'＋'+fmtPt(50/S.mc.length):'0'} 分</span>`:''}</div>
    <div class="stem">${q.q}</div>${tableHTML(q.table)}
    <div class="opts">${opts}</div>${sol}</section>`;
}

function calcHTML(q,i){
  const per = 50/S.calc.length/q.parts.length;
  const body = q.parts.map((p,pi)=>{
    const key=q.id+'.'+pi, v=S.answers[key];
    let field, sol='';
    if(p.type==='num'){
      field=`<div class="inrow"><input type="text" id="in_${key}" data-k="${key}"
        value="${v!==undefined?v:''}" placeholder="答案" ${S.submitted?'disabled':''}
        inputmode="decimal" autocomplete="off">
        ${p.unit?`<span class="unit">${p.unit}</span>`:''}
        <span class="tolnote">容許誤差 ±${p.tol}</span></div>`;
      if(S.submitted){
        const ok = gradeNum(p, v);
        sol=`<div class="sol ${ok?'good':'bad'}"><span class="lab">${
          v===undefined||v===''?'未作答':ok?'答對':'答錯'}　標準答案 ${p.ans}${p.unit||''}</span>
          ${p.sol}</div>` + (p.wide?tableHTML(p.wide):'');
      }
    } else {
      field=`<textarea id="in_${key}" data-k="${key}" ${S.submitted?'disabled':''}
        placeholder="請寫出完整句子或列式">${v!==undefined?v:''}</textarea>`;
      if(S.submitted){
        const checked = (S.rub[key]||[]);
        sol=`<div class="sol"><span class="lab">參考答案</span>${p.ref}
          <ul class="rub">${p.rubric.map((r,ri)=>`<li><input type="checkbox" data-r="${key}" data-ri="${ri}"
            id="rb_${key}_${ri}" ${checked.includes(ri)?'checked':''}><label for="rb_${key}_${ri}">${r}</label></li>`).join('')}</ul>
          <div class="tolnote" style="margin-top:8px">勾選你確實寫到的要點，系統依比例給分。</div></div>`;
      }
    }
    let vd='';
    if(S.submitted){
      const sc = partScore(q,pi)*per;
      const cl = sc>=per*0.99?'ok':sc<=0.01?'no':'half';
      vd=`<span class="verdict ${cl}" id="vd_${key}">${fmtPt(sc)} / ${fmtPt(per)} 分</span>`;
    }
    return `<div class="part"><div class="pq"><span class="plab">${p.label}</span>${p.q}${vd}</div>
      ${field}${sol}</div>`;
  }).join('');
  return `<section class="q is-calc"><div class="qhead"><span class="qno">${i+1}</span>${srcTag(q)}
    <span class="tag">${q.parts.length} 小題</span></div>
    <div class="stem">${q.stem}</div>${tableHTML(q.table)}${body}
    ${S.submitted&&q.note?`<div class="note"><span class="lab">考點提醒</span>${q.note}</div>`:''}</section>`;
}

/* ── 批改 ── */
function gradeNum(p, v){
  if(v===undefined||v==='') return false;
  const x = parseFloat(String(v).replace(/[^0-9.\-+eE]/g,''));
  return isFinite(x) && Math.abs(x - p.ans) <= p.tol + 1e-12;
}
function partScore(q, pi){        // 回傳 0~1
  const p=q.parts[pi], key=q.id+'.'+pi;
  if(p.type==='num') return gradeNum(p, S.answers[key])?1:0;
  const c=(S.rub[key]||[]).length;
  return p.rubric.length ? c/p.rubric.length : 0;
}
function totals(){
  let mcPts=0, mcMax=S.mc.length?50:0;
  if(S.mc.length){ const per=50/S.mc.length;
    S.mc.forEach(q=>{ if(S.answers[q.id]===q.ansAt) mcPts+=per; }); }
  let cPts=0, cMax=S.calc.length?50:0;
  if(S.calc.length){ const per=50/S.calc.length;
    S.calc.forEach(q=>{ let s=0; q.parts.forEach((p,pi)=>s+=partScore(q,pi));
      cPts += per * s/q.parts.length; }); }
  const max = mcMax+cMax || 1;
  return {mcPts, mcMax, cPts, cMax, score: Math.round((mcPts+cPts)/max*100)};
}
function topicStats(){
  const m={};
  const add=(t,got,of)=>{ (m[t]=m[t]||{g:0,o:0}); m[t].g+=got; m[t].o+=of; };
  S.mc.forEach(q=>add(q.topic, S.answers[q.id]===q.ansAt?1:0, 1));
  S.calc.forEach(q=>{ let s=0; q.parts.forEach((p,pi)=>s+=partScore(q,pi));
    add(q.topic, s, q.parts.length); });
  return m;
}

function updateStat(){
  const tot = S.mc.length + S.calc.reduce((a,q)=>a+q.parts.length,0);
  let done = S.mc.filter(q=>S.answers[q.id]!==undefined).length;
  S.calc.forEach(q=>q.parts.forEach((p,pi)=>{ const v=S.answers[q.id+'.'+pi]; if(v!==undefined&&v!=='') done++; }));
  $('#hstat').textContent = S.submitted ? '已批改' : `已作答 ${done} / ${tot}`;
  setRail(done/tot*100);
}

function refreshVerdict(key){
  const qid = key.slice(0, key.lastIndexOf('.')), pi = +key.slice(key.lastIndexOf('.')+1);
  const q = S.calc.find(x=>x.id===qid); if(!q) return;
  const el = document.getElementById('vd_'+key); if(!el) return;
  const per = 50/S.calc.length/q.parts.length, sc = partScore(q,pi)*per;
  el.className = 'verdict ' + (sc>=per*0.99?'ok':sc<=0.01?'no':'half');
  el.textContent = fmtPt(sc)+' / '+fmtPt(per)+' 分';
}

function wire(){
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const qid=b.dataset.q;
    S.answers[qid] = +b.dataset.k;
    if(S.instant){
      // 只重畫這一題，不動整頁，避免捲動位置與其他題的作答游標被重設
      const idx=S.mc.findIndex(x=>x.id===qid);
      const sec=document.getElementById('sec_'+qid);
      if(sec){ sec.outerHTML = mcHTML(S.mc[idx], idx); }
      updateStat();
    } else {
      const g=b.parentElement;
      g.querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-pressed', o===b));
      updateStat();
    }
  });
  app.querySelectorAll('input[type=text],textarea').forEach(el=>{
    el.oninput=()=>{ S.answers[el.dataset.k]=el.value; updateStat(); };
  });
  app.querySelectorAll('input[type=checkbox][data-r]').forEach(cb=>{
    cb.onchange=()=>{
      const k=cb.dataset.r, ri=+cb.dataset.ri;
      const arr=new Set(S.rub[k]||[]);
      cb.checked?arr.add(ri):arr.delete(ri);
      S.rub[k]=[...arr];
      refreshVerdict(k);
      showScore(true);
    };
  });
  const sb=$('#submit'); if(sb) sb.onclick=submit;
  const qb=$('#quit'); if(qb) qb.onclick=()=>{ if(S.instant||confirmLeave()) home(); };
}
function confirmLeave(){ return true; }

function submit(){
  S.submitted=true;
  // 更新錯題本
  S.mc.forEach(q=>{
    if(S.answers[q.id]===q.ansAt){ bumpRight(q.id); } else { store.wrong[q.id]=true; }
  });
  S.calc.forEach(q=>{
    let s=0; q.parts.forEach((p,pi)=>s+=partScore(q,pi));
    if(s/q.parts.length>=0.8) bumpRight(q.id); else store.wrong[q.id]=true;
  });
  save();
  render();
  showScore(false);
}
function bumpRight(id){
  store.seen[id]=(store.seen[id]||0)+1;
  if(store.seen[id]>=2) delete store.wrong[id];
}

function showScore(update){
  const t=totals(), ts=topicStats();
  const bars = Object.entries(ts).map(([k,v])=>{
    const pc = v.o? v.g/v.o*100 : 0;
    const cl = pc>=80?'':pc>=60?'warn':'poor';
    return `<div class="bar"><span class="nm" title="${k}">${k}</span>
      <span class="tr"><i class="${cl}" style="width:${pc.toFixed(0)}%"></i></span>
      <span class="pc">${pc.toFixed(0)}%</span></div>`;
  }).join('');
  const weak = Object.entries(ts).filter(([,v])=>v.o&&v.g/v.o<0.6).map(([k])=>k);
  const txt = S.calc.flatMap(q=>q.parts.map((p,pi)=>({q,p,pi}))).filter(o=>o.p.type==='text');
  const unmarked = txt.filter(o=>!(S.rub[o.q.id+'.'+o.pi]||[]).length).length;
  const selfNote = unmarked ? `<div class="note" style="margin-top:16px"><span class="lab">還有 ${unmarked} 小題沒自評</span>
    簡答題沒辦法自動批改，目前以 0 分計。請往下看每一題的參考答案，把你確實寫到的評分要點勾起來，分數會立刻更新。</div>` : '';
  const html = `<div class="score">
    <div class="eyebrow">${S.label}</div>
    <div class="big"><span class="n">${t.score}</span><span class="d">/ 100 分</span></div>
    <div class="split">
      <div class="sp"><div class="t">一、選擇題</div><div class="v">${fmtPt(t.mcPts)} <span class="unit">/ ${t.mcMax}</span></div></div>
      <div class="sp"><div class="t">二、計算與簡答</div><div class="v">${fmtPt(t.cPts)} <span class="unit">/ ${t.cMax}</span></div></div>
    </div>
    <div class="bars">${bars}</div>
    ${selfNote}
    ${weak.length?`<div class="note" style="margin-top:16px"><span class="lab">建議加強</span>
      ${weak.join('、')} —— 回去看這幾題標註的投影片頁碼，再用「主題練習」針對它做一輪。</div>`:
      `<div class="note" style="margin-top:16px"><span class="lab">狀況不錯</span>
      五個主題都在水準之上。可以換一份新的模擬測驗，題目會重抽。</div>`}
    <div class="actions">
      <button class="btn" id="again">再來一份（重新抽題）</button>
      <button class="btn ghost" id="hm">回首頁</button>
    </div>
    <div class="hist">錯題本目前 <span class="num">${Object.keys(store.wrong).length}</span> 題　·
      累計練習 <span class="num">${store.hist.length}</span> 次</div>
  </div>`;
  const old=$('.score');
  if(old){ old.outerHTML=html; } else { app.insertAdjacentHTML('afterbegin', html); }
  $('#again').onclick=()=>start(S.mode, S.label.split(' · ')[1]);
  $('#hm').onclick=home;
  if(!update){
    store.hist.push({score:t.score, label:S.label, at:Date.now()});
    if(store.hist.length>50) store.hist=store.hist.slice(-50);
    save();
    window.scrollTo({top:0,behavior:'smooth'});
  }
  updateStat();
}

$('#fratio').textContent = Math.round(DATA.meta.lecture_ratio*100)+'%';
home();
</script>
</body>
</html>
